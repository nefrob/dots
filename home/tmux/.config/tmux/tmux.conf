# -- General -------------------------------------------------------------------
# Enable mouse mode
setw -g mouse on

# Increase history limit
set -g history-limit 8192

# Edit configuration
bind e new-window -n "~/.tmux.conf.local" "sh -c '\${EDITOR:-vim} ~/.tmux.conf.local && tmux source ~/.tmux.conf && tmux display \"~/.tmux.conf sourced\"'"
# Reload configuration
bind r source-file ~/.tmux.conf \; display-message '~/.tmux.conf sourced'

# Enable native Mac OS X copy/paste
set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"

# -- Bindings ------------------------------------------------------------------
# Add secondary <prefix> (primary is C-b)
set -g prefix2 C-a
unbind-key C-a
bind-key C-a send-prefix -2

# Enable function/arrow keys
setw -g xterm-keys on
# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0

# Scrolling/text select uses vi keys
setw -g mode-keys vi

# Make command prompt accesible
bind-key : command-prompt
# Refresh display on visual activity change
bind-key r refresh-client
# Clear history
bind-key L clear-history
# Clear screen
bind C-l send-keys 'C-l'

# Window management
bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout
bind-key Tab last-window
bind-key c new-window

# Splits
# use vim-like keys for splits and windows
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Also setup arrow keys
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D
# And shortcuts for pane jumps
bind-key a last-pane
bind-key q display-panes

# Copy paste shortcuts
bind-key [ copy-mode
bind-key ] paste-buffer
# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

